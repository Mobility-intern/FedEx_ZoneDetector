version: "3.9"

services:
  zonedetector:
    image: zonedetector
    build:
      context: .
      dockerfile: ./Dockerfile
    command: >
      sh -c "pip install debugpy -t /tmp &&
             python /tmp/debugpy --wait-for-client --listen 0.0.0.0:5678 
             -m uvicorn src.main:app --host 0.0.0.0 --port 8000"
    ports:
      - 8000:8000
      - 5678:5678
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: react-frontend
    container_name: react_frontend_debug
    ports:
      - 3000:80
    depends_on:
      - zonedetector
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
